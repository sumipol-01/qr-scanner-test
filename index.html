<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>METALEX QR Scanner</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      text-align: center;
    }

    #app {
      display: none;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #result {
      margin-top: 20px;
      padding: 15px;
      background: #eee;
      border-radius: 8px;
      word-break: break-all;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h2>METALEX 2026 QR Scanner</h2>

  <div id="loginBox">

    <div id="g_id_onload"
      data-client_id="54179589615-lp0lm47bb97lfcs9o64l56m8m40u0dvk.apps.googleusercontent.com"
      data-callback="handleCredentialResponse"
      data-auto_prompt="false">
    </div>

    <div class="g_id_signin"
      data-type="standard"
      data-size="large">
    </div>

  </div>

  <div id="app">
    <p id="userEmail"></p>

    <button onclick="startScanner()">Start Scanner</button>

    <div id="reader"></div>

    <div id="result">
      Waiting for QR...
    </div>
  </div>


<script>

function handleCredentialResponse(response) {

  const payload = parseJwt(response.credential);

  const allowedDomain = "sumipol.com";

  if (payload.hd !== allowedDomain) {
    document.getElementById("loginBox").innerHTML =
      "<p style='color:red;'>Access denied<br>Company account required.</p>";

    document.getElementById("app").style.display = "none";
    return;
  }

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";

  document.getElementById("userEmail").innerText =
    "Signed in: " + payload.email;
}


function parseJwt(token) {

  const base64Url = token.split('.')[1];

  const base64 = base64Url
    .replace(/-/g, '+')
    .replace(/_/g, '/');

  const jsonPayload = decodeURIComponent(
    atob(base64)
      .split('')
      .map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      )
      .join('')
  );

  return JSON.parse(jsonPayload);
}


let scanner;

function startScanner() {

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: 250
    },
    decodedText => {

      document.getElementById("result").innerText =
        decodedText;

      scanner.stop();
    },
    error => {}
  );
}

</script>

</body>
</html>
